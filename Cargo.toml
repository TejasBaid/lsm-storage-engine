[package]
name = "lsm-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/TejasBaid/lsm-storage-engine"
description = "An embeddable LSM-tree key-value storage engine: WAL, leveled compaction, MVCC snapshots, bloom-filtered SSTables"
readme = "README.md"
keywords = ["database", "lsm-tree", "storage-engine", "key-value", "embedded"]
categories = ["database-implementations", "data-structures"]

[lib]
name = "lsm_engine"
path = "src/lib.rs"

[[bin]]
name = "lsm"
path = "src/bin/lsm.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
crc32fast = "1.4"
crossbeam-skiplist = "0.1"
parking_lot = "0.12"
thiserror = "2"
clap = { version = "4.5", features = ["derive", "env"], optional = true }

[dev-dependencies]
criterion = "0.8"
proptest = "1"
sled = "0.34.7"
tempfile = "3"

[[bench]]
name = "db_bench"
harness = false

[[bench]]
name = "micro"
harness = false

[profile.bench]
debug = 1
